; M5Stack CoreS3 内蔵IMU(BMI270)ロガー
;
;   ビルド  : pio run
;   書き込み: pio run -t upload
;   シリアル: pio device monitor -b 921600
;
; ブラウザから書き込む場合はビルド不要。
;   https://sat0esus.github.io/imu1/

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 921600
upload_speed = 921600

lib_deps =
    m5stack/M5Unified

build_flags =
    ; ボード定義にも入っているが、書き込み方法によらず確実に有効にするため明示する。
    ; これが無いと Serial がUSBに出ず、PC側ロガーが何も受け取れない。
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
